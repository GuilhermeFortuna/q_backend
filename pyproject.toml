[project]
name = "q-backend"
version = "0.1.0"
description = "Backend project"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.136.3",
    "metatrader5>=5.0.5735",
    "numpy>=2.4.4",
    "optuna>=4.9.0",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "pytest>=9.0.3",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.48.0",
    "yfinance>=1.3.0",
]

[project.scripts]
dev = "q_backend.api.main:run_dev"
q-optimize = "q_backend.cli.q_optimize:main"

[dependency-groups]
dev = [
    "black",
    "fakeredis>=2.26.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires running Postgres and Redis (docker compose)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py312"]
