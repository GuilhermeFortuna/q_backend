[project]
name = "q-backend"
version = "0.1.0"
description = "Backend project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "metatrader5>=5.0.5735",
    "numpy>=2.4.4",
    "optuna>=4.9.0",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "uvicorn>=0.48.0",
    "yfinance>=1.3.0",
]

[project.scripts]
dev = "q_backend.api.main:run_dev"

[dependency-groups]
dev = [
    "black",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py312"]
