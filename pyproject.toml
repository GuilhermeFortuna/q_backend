[project]
name = "q-backend"
version = "0.1.0"
description = "Backend project"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "black",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py312"]
