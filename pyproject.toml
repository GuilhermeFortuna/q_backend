[project]
name = "q-backend"
version = "0.1.0"
description = "Backend project"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "dramatiq[redis]>=1.17.0",
    "fastapi>=0.136.3",
    "metatrader5>=5.0.5735; sys_platform == 'win32'",
    "metatrader5; sys_platform != 'win32'",
    "numpy>=2.4.4",
    "optuna>=4.9.0",
    "scikit-learn>=1.5.0",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "pytest>=9.0.3",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.48.0",
    "yfinance>=1.3.0",
    "numba>=0.65.1",
    "pyarrow>=24.0.0",
    "torch>=2.6.0",
    "httpx>=0.28.1",
]

[project.scripts]
dev = "q_backend.api.main:run_dev"
worker = "q_backend.cli.worker:main"
q-optimize = "q_backend.cli.q_optimize:main"
q-train-encoder = "q_backend.cli.q_train_encoder:main"
q-promote-encoder = "q_backend.cli.q_promote_encoder:main"
q-execution = "q_backend.cli.q_execution:main"

[dependency-groups]
dev = [
    "black",
    "fakeredis>=2.26.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests/api", "tests"]
markers = [
    "integration: requires running Postgres and Redis (docker compose)",
    "live_gateway: requires a reachable Q_MT5_GATEWAY_URL (WO190 live pass)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py312"]

# Scoped, deliberately minimal lint config (WO179). We enable only the two
# silent-failure rules so this stays a policy guard, not a lint-the-world sweep:
#   BLE001 — blind ``except Exception`` that neither re-raises nor logs
#   S110   — ``try: ... except: pass`` (swallowed error)
# Every sanctioned best-effort catch carries a per-line ``# noqa`` + justification.
[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["BLE001", "S110"]

[tool.uv.sources]
metatrader5 = [
    { path = "docker/metatrader5-stub", marker = "sys_platform != 'win32'" }
]

