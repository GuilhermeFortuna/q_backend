[project]
name = "metatrader5"
version = "0.0.0"
description = "No-op MetaTrader5 stub for Linux Docker images (real MT5 is Windows-only)."
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["MetaTrader5"]
