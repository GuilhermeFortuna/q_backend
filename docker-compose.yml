# Local development stack.
#
# Default (infra only — use with native backend/worker for MetaTrader5):
#   docker compose up -d
#
# Full stack in containers (no live MT5) — also used by workspace `./research`:
#   docker compose --profile containerized up -d
#   (image is built by ./research; Compose starts the named image only)
#
# Recommended Windows workflow from monorepo root:
#   ..\dev.ps1

x-backend-runtime: &backend-runtime
  image: ${Q_BACKEND_IMAGE:-q-backend:dev}
  env_file:
    - path: .env
      required: false
  environment:
    Q_DATABASE_URL: postgresql+psycopg://q:q@postgres:5432/q
    Q_REDIS_URL: redis://redis:6379/0
    Q_DATA_LAKE_ROOT: /data/lake
    Q_MARKET_DATA_ROOT: /data/market
    Q_TICK_CACHE_DIR: /data/tick_cache
    Q_RUNTIME_CONFIG_PATH: /data/runtime_config.json
    Q_WORKER_PROCESSES: ${Q_WORKER_PROCESSES:-14}
  volumes:
    - ./data:/data
    - ./src:/app/src:ro
    - ./contracts:/app/contracts:ro
    - ./alembic:/app/alembic:ro
    - ./alembic.ini:/app/alembic.ini:ro

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: q
      POSTGRES_PASSWORD: q
      POSTGRES_DB: q
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U q -d q"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-runtime
    profiles: ["containerized"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *backend-runtime
    profiles: ["containerized"]
    command: ["worker"]
    environment:
      Q_DATABASE_URL: postgresql+psycopg://q:q@postgres:5432/q
      Q_REDIS_URL: redis://redis:6379/0
      Q_DATA_LAKE_ROOT: /data/lake
      Q_MARKET_DATA_ROOT: /data/market
      Q_TICK_CACHE_DIR: /data/tick_cache
      Q_RUNTIME_CONFIG_PATH: /data/runtime_config.json
      Q_WORKER_PROCESSES: ${Q_WORKER_PROCESSES:-14}
      Q_TORCH_DEVICE: ${Q_TORCH_DEVICE:-cuda}
      CUBLAS_WORKSPACE_CONFIG: ${CUBLAS_WORKSPACE_CONFIG:-:4096:8}
    gpus: all
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
