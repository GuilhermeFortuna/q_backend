services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: q
      POSTGRES_PASSWORD: q
      POSTGRES_DB: q
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  postgres_data:
